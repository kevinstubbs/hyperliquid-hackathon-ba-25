[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

[rpc_endpoints]
hyperliquid = "${HYPERLIQUID_RPC_URL}"
local = "http://127.0.0.1:8545"

[etherscan]
hyperliquid = { key = "${ETHERSCAN_API_KEY}" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
